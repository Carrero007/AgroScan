<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroScan · Catálogo de Hortaliças</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/hortalicas.css" />
    <script src="js/hortalicas.js" defer></script>
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <!-- Logo -->
        <div class="sidebar-logo">
            <div class="sidebar-logo-icon">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M7 17c.667-3.333 4-8 9-9-1 5-4.667 8.333-9 9z" />
                </svg>
            </div>
            <div class="sidebar-logo-text">
                <strong>AgroScan</strong>
                <span>Diagnóstico do Campo</span>
            </div>
            <svg class="sidebar-logo-diamond" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="12 2 22 12 12 22 2 12" />
            </svg>
        </div>

        <!-- Nav -->
        <nav class="sidebar-nav">
            <div class="nav-group">
                <p class="nav-group-label">Análise</p>
                <ul>
                    <li class="nav-item">
                        <a href="diagnosticar.html">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8" /><path stroke-linecap="round" d="M21 21l-4.35-4.35" /></svg>
                            Diagnosticar
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="identificar.html">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" /><path stroke-linecap="round" stroke-linejoin="round" d="M3 9h18M9 21V9" /></svg>
                            Identificar Hortaliça
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="historico.html">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0z" /></svg>
                            Histórico
                        </a>
                    </li>
                </ul>
            </div>
            <div class="nav-group">
                <p class="nav-group-label">Catálogo</p>
                <ul>
                    <li class="nav-item">
                        <a href="hortalicas.html">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 22V12M12 12C12 7 7 3 3 3c0 5 3 9 9 9zM12 12c0-5 5-9 9-9 0 5-3 9-9 9z" /></svg>
                            Hortaliças
                        </a>
                    </li>
                </ul>
            </div>
            <div class="nav-group">
                <p class="nav-group-label">Conta</p>
                <ul>
                    <li class="nav-item">
                        <a href="dashboard.html" class="active">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" /><rect x="14" y="3" width="7" height="7" /><rect x="14" y="14" width="7" height="7" /><rect x="3" y="14" width="7" height="7" /></svg>
                            Visão geral
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="logout.html">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h4a3 3 0 0 1 3 3v1" /></svg>
                            Sair
                        </a>
                    </li>
                </ul>
            </div>
        </nav>
        <!-- Usuário -->
        <div class="sidebar-user">
            <div class="sidebar-user-inner">
                <div class="avatar">P</div>
                <div class="sidebar-user-info">
                    <strong>Produtor</strong>
                    <span>Conta básica</span>
                </div>
            </div>
        </div>
    </aside>

    <main class="main">
        <div class="topbar">
            <div class="topbar-title">📚 Catálogo de Hortaliças</div>
        </div>

        <div class="page-body">
            <!-- FILTROS -->
            <div class="filter-row">
                <div class="search-wrap">
                    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6.5" cy="6.5" r="4" /><path d="m11 11 3 3" /></svg>
                    <input type="text" id="busca" placeholder="Buscar hortaliça..." oninput="filtrar()" />
                </div>
                <select class="filter-select" id="filtroCat" onchange="filtrar()">
                    <option value="">Todas as categorias</option>
                    <option value="folhosa">Folhosa</option>
                    <option value="fruto">Fruto</option>
                    <option value="raiz">Raiz</option>
                    <option value="bulbo">Bulbo</option>
                    <option value="legume">Legume</option>
                    <option value="brassica">Brássica</option>
                </select>
            </div>

            <!-- GRID -->
            <div class="hortalicas-grid" id="grid">
                <!-- skeletons -->
                <div class="h-card" style="pointer-events:none">
                    <div class="h-card-header"><div class="skeleton" style="width:44px;height:44px;border-radius:10px"></div><div><div class="skeleton" style="height:13px;width:100px;margin-bottom:6px"></div><div class="skeleton" style="height:10px;width:70px"></div></div></div>
                </div>
                <div class="h-card" style="pointer-events:none">
                    <div class="h-card-header"><div class="skeleton" style="width:44px;height:44px;border-radius:10px"></div><div><div class="skeleton" style="height:13px;width:110px;margin-bottom:6px"></div><div class="skeleton" style="height:10px;width:80px"></div></div></div>
                </div>
                <div class="h-card" style="pointer-events:none">
                    <div class="h-card-header"><div class="skeleton" style="width:44px;height:44px;border-radius:10px"></div><div><div class="skeleton" style="height:13px;width:90px;margin-bottom:6px"></div><div class="skeleton" style="height:10px;width:60px"></div></div></div>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL -->
    <div class="overlay" id="overlay" onclick="fecharModal(event)">
        <div class="modal" id="modal">
            <div class="modal-header">
                <div class="modal-emoji" id="mEmoji">🌱</div>
                <div>
                    <div class="modal-nome" id="mNome">—</div>
                    <div class="modal-cientifico" id="mCientifico">—</div>
                </div>
                <button class="modal-close" onclick="fecharModal()">×</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>
</body>
</html>
